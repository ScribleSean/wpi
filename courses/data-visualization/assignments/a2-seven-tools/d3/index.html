<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Penguins – d3</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; }
    .axis-label { font-size: 14px; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script>
    const width = 700;
    const height = 500;
    const margin = { top: 40, right: 120, bottom: 50, left: 60 };

    const speciesColors = {
      Adelie: "#F5A623",
      Chinstrap: "#9B59B6",
      Gentoo: "#1ABC9C"
    };

    d3.csv("../penglings.csv").then(data => {
      const filtered = data.filter(d => {
        const fl = +d.flipper_length_mm, bm = +d.body_mass_g, bl = +d.bill_length_mm;
        return !isNaN(fl) && !isNaN(bm) && !isNaN(bl);
      });

      const xExtent = d3.extent(filtered, d => +d.flipper_length_mm);
      const yExtent = d3.extent(filtered, d => +d.body_mass_g);
      const sizeExtent = d3.extent(filtered, d => +d.bill_length_mm);

      const xScale = d3.scaleLinear()
        .domain([Math.floor(xExtent[0] / 10) * 10, Math.ceil(xExtent[1] / 10) * 10])
        .range([margin.left, width - margin.right]);

      const yScale = d3.scaleLinear()
        .domain([Math.floor(yExtent[0] / 500) * 500, Math.ceil(yExtent[1] / 500) * 500])
        .range([height - margin.bottom, margin.top]);

      const sizeScale = d3.scaleLinear()
        .domain(sizeExtent)
        .range([4, 18]);

      const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

      const xAxis = d3.axisBottom(xScale).ticks(7).tickFormat(d => d);
      const yAxis = d3.axisLeft(yScale).ticks(7).tickFormat(d => d);

      svg.append("g")
        .attr("transform", `translate(0,${height - margin.bottom})`)
        .call(xAxis)
        .append("text")
        .attr("class", "axis-label")
        .attr("x", (width - margin.left - margin.right) / 2 + margin.left)
        .attr("y", 36)
        .attr("fill", "currentColor")
        .attr("text-anchor", "middle")
        .text("Flipper Length (mm)");

      svg.append("g")
        .attr("transform", `translate(${margin.left},0)`)
        .call(yAxis)
        .append("text")
        .attr("class", "axis-label")
        .attr("transform", "rotate(-90)")
        .attr("x", -(height - margin.top - margin.bottom) / 2 - margin.top)
        .attr("y", -45)
        .attr("fill", "currentColor")
        .attr("text-anchor", "middle")
        .text("Body Mass (g)");

      svg.selectAll("circle")
        .data(filtered)
        .join("circle")
        .attr("cx", d => xScale(+d.flipper_length_mm))
        .attr("cy", d => yScale(+d.body_mass_g))
        .attr("r", d => sizeScale(+d.bill_length_mm))
        .attr("fill", d => speciesColors[d.species] || "#999")
        .attr("opacity", 0.8);
    }).catch(err => console.error("Failed to load data:", err));
  </script>
</body>
</html>
