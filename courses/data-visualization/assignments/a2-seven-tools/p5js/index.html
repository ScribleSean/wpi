    <script>
      const speciesColors = {
        Adelie: [245, 166, 35],
        Chinstrap: [155, 89, 182],
        Gentoo: [26, 188, 156],
      };
      let data = [];
      let xMin, xMax, yMin, yMax, sizeMin, sizeMax;

      function parseCSV(csvText) {
        const lines = csvText.trim().split("\n");
        const headers = lines[0].split(",");
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const vals = lines[i].split(",");
          const row = {};
          headers.forEach((h, j) => {
            row[h.trim()] = vals[j] ? vals[j].trim() : "";
          });
          rows.push(row);
        }
        return rows;
      }

      function setup() {
        createCanvas(700, 500);
        noLoop();

        const csvEl = document.getElementById("penglings-csv");
        const csvText = csvEl ? csvEl.textContent : "";
        const rows = parseCSV(csvText);
        for (const r of rows) {
          const fl = parseFloat(r.flipper_length_mm);
          const bm = parseFloat(r.body_mass_g);
          const bl = parseFloat(r.bill_length_mm);
          const sp = r.species;
          if (!isNaN(fl) && !isNaN(bm) && !isNaN(bl) && sp) {
            data.push({
              flipper_length_mm: fl,
              body_mass_g: bm,
              bill_length_mm: bl,
              species: sp,
            });
          }
        }
        if (data.length === 0) return;
        const fls = data.map((d) => d.flipper_length_mm);
        const bms = data.map((d) => d.body_mass_g);
        const bls = data.map((d) => d.bill_length_mm);
        xMin = Math.floor(Math.min(...fls) / 10) * 10;
        xMax = Math.ceil(Math.max(...fls) / 10) * 10;
        yMin = Math.floor(Math.min(...bms) / 500) * 500;
        yMax = Math.ceil(Math.max(...bms) / 500) * 500;
        sizeMin = Math.min(...bls);
        sizeMax = Math.max(...bls);
      }

      function draw() {
        background(255);
        if (data.length === 0) {
          fill(100);
          textAlign(CENTER, CENTER);
          text("No data loaded", width / 2, height / 2);
          return;
        }
        const margin = { left: 70, right: 80, top: 40, bottom: 50 };
        const w = width - margin.left - margin.right;
        const h = height - margin.top - margin.bottom;
        // plot coords (inside translated area)
        const xPlot = (v) => ((v - xMin) / (xMax - xMin)) * w;
        const yPlot = (v) => (1 - (v - yMin) / (yMax - yMin)) * h;
        // canvas coords for axis labels
        const xScale = (v) => margin.left + ((v - xMin) / (xMax - xMin)) * w;
        const yScale = (v) => margin.top + (1 - (v - yMin) / (yMax - yMin)) * h;
        const rScale = (v) => 2 + ((v - sizeMin) / (sizeMax - sizeMin)) * 8;

        push();
        translate(margin.left, margin.top);

        // grid
        stroke(200);
        strokeWeight(1);
        for (let x = xMin; x <= xMax; x += 10) {
          line(xPlot(x), 0, xPlot(x), h);
        }
        for (let y = yMin; y <= yMax; y += 500) {
          line(0, yPlot(y), w, yPlot(y));
        }

        noStroke();
        data.forEach((d) => {
          const c = speciesColors[d.species] || [128, 128, 128];
          fill(c[0], c[1], c[2], 255 * 0.8);
          circle(
            xPlot(d.flipper_length_mm),
            yPlot(d.body_mass_g),
            2 * rScale(d.bill_length_mm),
          );
        });

        pop();

        // axis labels and ticks
        textAlign(CENTER);
        textSize(12);
        fill(0);
        text("Flipper Length (mm)", width / 2, height - 10);
        push();
        translate(18, height / 2);
        rotate(-HALF_PI);
        text("Body Mass (g)", 0, 0);
        pop();

        for (let x = xMin; x <= xMax; x += 10) {
          text(x, xScale(x), height - margin.bottom + 22);
        }
        for (let y = yMin; y <= yMax; y += 500) {
          text(y, margin.left - 12, yScale(y) + 4);
        }
      }
