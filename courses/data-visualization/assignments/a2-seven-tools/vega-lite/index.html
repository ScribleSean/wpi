<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Penguins – Vega-Lite</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    // use a local server so the csv loads
    vegaEmbed("#vis", "spec.json", { actions: false }).catch(() => {
      document.getElementById("vis").innerHTML = "<p>Load via a local server (e.g. python -m http.server).</p>";
    });
  </script>
</body>
</html>
